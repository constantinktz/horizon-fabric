name: Bug report
description: A mod here does something wrong
labels: [bug]
body:
  - type: input
    id: mod
    attributes:
      label: Mod and version
      placeholder: starfall 0.1.0
    validations:
      required: true
  - type: input
    id: horizon
    attributes:
      label: Horizon version
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: textarea
    id: log
    attributes:
      label: Log or crash report
      render: text
