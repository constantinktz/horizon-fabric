name: fabric-checks

# The checks this repository runs on its own (upstream's workflows are turned off here, see upstream-sync.yml):
# formatting, clippy and the tests of the Fabric port, and the end-to-end tool's helpers.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: fabric-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fabric:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Clippy (protocol, items)
        run: cargo clippy -p horizon-protocol -p horizon-items --all-targets -- -D warnings
      - name: Tests (protocol, items)
        run: cargo test -p horizon-protocol -p horizon-items --lib
      - name: End-to-end tool helpers
        run: python3 -m unittest tests.test_fabric_e2e
      - name: No Mojang files
        run: python3 tools/check_public_tree.py
      - name: Mod ports
        run: python3 tools/check_fabric_mods.py
